<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amber VU</title><link rel="stylesheet" href="visualizer.css"></head>
<body><main>
<header><div><span class="eyebrow">A PERSONAL LISTENING ROOM</span><h1>Amber<span>VU</span><i>●</i></h1><div class="creator"><a class="creator-name" href="https://github.com/kahraman-melek-mimar" target="_blank" rel="noopener noreferrer">by Kahraman MELEK®</a><a href="mailto:kahraman.melek@gmail.com">kahraman.melek@gmail.com</a><a href="https://github.com/kahraman-melek-mimar" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></div><button id="stop">Dinlemeyi durdur</button></header>
<div class="toolbar"><label>KOLEKSİYON<select id="theme"><option value="vintage">01 / Vintage Hi-Fi</option><option value="studio">02 / Stüdyo Tipi</option><option value="cassette">03 / Kasetçalar</option><option value="tubes">04 / Lambalı Amfi</option><option value="led">05 / Retro LED</option><option value="nixie">06 / Nixie</option><option value="scope">07 / Osiloskop</option><option value="vector">08 / Stereo Vektör</option><option value="matrix">09 / Radial Stereo</option><option value="smoke">10 / Nebula • Cam Duman</option><option value="laser">11 / Photon • Lazer Odası</option><option value="lightning">12 / Tesla • Şimşek</option><option value="ecgGlass">13 / EKG • Cam</option><option value="ecgPaper">14 / EKG • Kâğıt</option><option value="ecgVintage">15 / EKG • Vintage</option></select></label><label id="modeLabel">NIXIE GÖSTERGESİ<select id="mode"><option value="elapsed">Geçen süre</option><option value="remaining">Kalan süre</option><option value="clock">Saat</option></select></label></div>
<section class="stage"><canvas id="screen" aria-label="Canlı stereo ses görselleştirmesi"></canvas><div id="nixie" hidden></div></section>
<div class="status"><span id="live">● SES BEKLENİYOR</span><span id="levels">L −60 · R −60 dBFS</span></div>
<footer><div><span class="eyebrow">ŞİMDİ ÇALIYOR</span><p id="track">Seçtiğin sekmedeki müzik</p></div><label class="light">AYDINLATMA <input id="brightness" type="range" min="35" max="100" value="85"></label></footer>
<p id="notice">Ses yalnızca bu cihazda işlenir. Pencereyi kapatınca dinleme sona erer.</p>
</main><script type="module" src="visualizer.js"></script></body></html>
